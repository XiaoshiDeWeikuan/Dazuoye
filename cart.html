<!-- 包含：购物车商品管理、结算功能、支付模态框、订单确认-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的购物车 - HIGO购物</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
    <style>
        /* 确保付款模态框按钮可见 */
        #paymentModal .modal-footer {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 25px;
            background-color: #f9f9f9;
            border-top: 1px solid #eee;
            justify-content: flex-end;
            gap: 15px;
            border-radius: 0 0 12px 12px;
        }
        
        #paymentModal .modal-footer button {
            min-width: 100px;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        
        #paymentModal .modal-footer .btn-secondary {
            background-color: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }
        
        #paymentModal .modal-footer .btn-secondary:hover {
            background-color: #e8e8e8;
        }
        
        #paymentModal .modal-footer .btn-primary {
            background-color: #e4393c;
            color: white;
        }
        
        #paymentModal .modal-footer .btn-primary:hover {
            background-color: #c20c0e;
        }
        
        /* 移除清空购物车确认模态框的关闭按钮 */
        #clearCartModal .close-modal {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- 顶部头部 -->
    <header>
        <div class="header-top">
            <div class="logo">
                <a href="index.html" style="color: white; text-decoration: none;">
                    <i class="fas fa-shopping-bag"></i>
                    <span>HIGO购物</span>
                </a>
            </div>
            <div class="user-actions">
                <a id="userStatus">您好，请登录</a>
                <a href="index.html">返回首页</a>
                <a>我的订单</a>
                <a>客户服务</a>
            </div>
        </div>
    </header>

    <!-- 购物车标题 -->
    <div class="cart-header">
        <div class="container">
            <h1><i class="fas fa-shopping-cart"></i> 我的购物车</h1>
            <div class="cart-steps">
                <div class="step active">
                    <span>1</span>
                    <span>查看购物车</span>
                </div>
                <div class="step">
                    <span>2</span>
                    <span>确认订单</span>
                </div>
                <div class="step">
                    <span>3</span>
                    <span>付款成功</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 购物车内容 -->
    <div class="container cart-main-layout">
        <!-- 左侧：商品列表 -->
        <div class="cart-items-section">
            <div class="cart-table-header">
                <div class="cart-table-row">
                    <div class="cart-table-col product-col">商品信息</div>
                    <div class="cart-table-col price-col"><span class="col-label">单价</span></div>
                    <div class="cart-table-col quantity-col"><span class="col-label">数量</span></div>
                    <div class="cart-table-col total-col"><span class="col-label">小计</span></div>
                    <div class="cart-table-col action-col"><span class="col-label">操作</span></div>
                </div>
            </div>

            <div class="cart-items-scroll" id="cartItemsScroll">
                <div class="cart-items-list" id="cartItemsList">
                    <!-- 购物车商品将通过JS动态加载 -->
                </div>
            </div>
            
            <div class="cart-actions">
                <a href="index.html" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> 继续购物
                </a>
                <button class="btn-danger" id="clearCartBtn">
                    <i class="fas fa-trash"></i> 清空购物车
                </button>
            </div>
        </div>

        <!-- 右侧：结算栏 -->
        <div class="cart-summary-section">
            <div class="summary-card">
                <div class="summary-header">
                    <h3>订单结算</h3>
                </div>
                <div class="summary-content">
                    <div class="summary-row">
                        <span>商品件数：</span>
                        <span id="itemsCount">0件</span>
                    </div>
                    <div class="summary-row">
                        <span>商品总价：</span>
                        <span id="subtotal">¥0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>运费：</span>
                        <span id="shippingFee">¥0.00</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>应付总额：</span>
                        <span id="totalAmount">¥0.00</span>
                    </div>
                    <button class="checkout-btn" id="checkoutBtn">
                        <i class="fas fa-credit-card"></i> 去结算
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 付款确认模态框 -->
    <div class="modal" id="paymentModal" style="display: none;">
    <div class="modal-content payment-modal">
        <div class="modal-header">
            <h3>确认付款</h3>
            <button class="close-modal" id="closePaymentModal">&times;</button>
        </div>
        <div class="modal-body">
            <!-- 支付方式选择 -->
            <div class="payment-method">
                <h4>选择支付方式：</h4>
                <div class="payment-options">
                    <label class="payment-option active">
                        <input type="radio" name="paymentMethod" value="wechat" checked>
                        <i class="fab fa-weixin"></i>
                        <span>微信支付</span>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="alipay">
                        <i class="fab fa-alipay"></i>
                        <span>支付宝</span>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="card">
                        <i class="fas fa-credit-card"></i>
                        <span>银行卡支付</span>
                    </label>
                </div>
            </div>
            
            <!-- 付款金额 -->
            <div class="payment-amount-container">
                <div class="payment-amount">
                    <span class="payment-amount-label">付款金额：</span>
                    <span class="payment-amount-value" id="paymentAmount">¥0.00</span>
                </div>
            </div>
        </div>
        <!-- 按钮区域 -->
        <div class="modal-footer">
            <button class="btn-secondary" id="cancelPayment">取消</button>
            <button class="btn-primary" id="confirmPayment">确认付款</button>
        </div>
    </div>
</div>
    <!-- 付款成功模态框 -->
    <div class="modal" id="successModal" style="display: none;">
        <div class="modal-content success-modal">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3>付款成功！</h3>
            <p>付款成功，订单处理中...</p>
            <div class="success-actions">
                <button class="btn-primary" id="backToHome">返回首页</button>
                <button class="btn-secondary" id="viewOrders">查看订单</button>
            </div>
        </div>
    </div>

    <!-- 清空购物车确认模态框  -->
    <div class="modal" id="clearCartModal" style="display: none;">
        <div class="modal-content confirm-modal">
            <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
                <h3>确认清空购物车</h3>
            </div>
            <div class="modal-body">
                <div class="confirm-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <p>确定要清空购物车中的所有商品吗？</p>
                <p class="confirm-warning">此操作不可撤销</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelClear">否，取消</button>
                <button class="btn-danger" id="confirmClear">是，清空购物车</button>
            </div>
        </div>
    </div>

    <script src="js/products.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
