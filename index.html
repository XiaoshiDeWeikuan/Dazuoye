<!-- 包含：顶部导航、搜索栏、轮播图、商品分类、商品展示、登录注册模态框、页脚 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIGO购物 - 正品低价，品质保障</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth-modal.css">
</head>
<body>
    <!-- 顶部头部 -->
    <header>
        <div class="header-top">
            <div class="logo">
                <i class="fas fa-shopping-bag"></i>
                <span>HIGO购物</span>
            </div>
            <div class="user-actions">
                <a id="userStatus">您好，请登录</a>
                <a id="registerBtn">免费注册</a>
                <a>我的订单</a>
                <a>客户服务</a>
            </div>
        </div>
    </header>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="25216950422黄浩嘉">
            <button class="search-btn" id="searchBtn">
                <i class="fas fa-search"></i> 搜索
            </button>
            <div class="cart-icon" id="cartIcon">
                <a href="cart.html" style="color: inherit; text-decoration: none;">
                    <i class="fas fa-shopping-cart fa-2x"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </div>

    <!-- 轮播图 -->
    <div class="banner-section">
        <div class="banner-container" id="bannerContainer">
            <!-- 轮播图将通过JS动态加载 -->
        </div>
        <div class="banner-indicators" id="bannerIndicators">
            <!-- 指示器将通过JS动态加载 -->
        </div>
    </div>

    <!-- 分类导航 -->
    <nav>
        <div class="categories">
            <div class="category active" data-category="all">
                <i class="fas fa-home"></i>
                <span>全部商品</span>
            </div>
            <div class="category" data-category="electronics">
                <i class="fas fa-laptop"></i>
                <span>电脑数码</span>
            </div>
            <div class="category" data-category="clothing">
                <i class="fas fa-tshirt"></i>
                <span>服装服饰</span>
            </div>
            <div class="category" data-category="home">
                <i class="fas fa-home"></i>
                <span>家居家装</span>
            </div>
            <div class="category" data-category="food">
                <i class="fas fa-utensils"></i>
                <span>食品饮料</span>
            </div>
            <div class="category" data-category="sports">
                <i class="fas fa-futbol"></i>
                <span>运动户外</span>
            </div>
            <div class="category" data-category="books">
                <i class="fas fa-book"></i>
                <span>图书音像</span>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="container">
        <!-- 商品展示区域 -->
        <div class="products-section">
            <div class="section-title">
                <h2 id="categoryTitle">推荐商品</h2>
            </div>
            <div class="products-grid" id="productsGrid">
                <!-- 商品将通过JS动态加载 -->
            </div>
        </div>
        
        <!-- 已删除购物车侧边栏 -->
    </div>

    <!-- 登录/注册模态框 -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <div class="tab-switch">
                <div class="tab active" data-tab="login">登录</div>
                <div class="tab" data-tab="register">注册</div>
            </div>
            
            <div class="tab-content active" id="loginTab">
                <h3 class="modal-title">用户登录</h3>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginUsername">用户名</label>
                        <input type="text" id="loginUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="closeModal">取消</button>
                        <button type="submit" class="btn btn-primary">登录</button>
                    </div>
                </form>
            </div>
            
            <div class="tab-content" id="registerTab">
                <h3 class="modal-title">用户注册</h3>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerUsername">用户名</label>
                        <input type="text" id="registerUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">邮箱</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">密码</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="registerConfirmPassword">确认密码</label>
                        <input type="password" id="registerConfirmPassword" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="closeModal2">取消</button>
                        <button type="submit" class="btn btn-primary">注册</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>购物指南</h3>
                <ul>
                    <li><a href="#">购物流程</a></li>
                    <li><a href="#">会员介绍</a></li>
                    <li><a href="#">联系客服</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>配送方式</h3>
                <ul>
                    <li><a href="#">上门自提</a></li>
                    <li><a href="#">配送服务</a></li>
                    <li><a href="#">配送费收取标准</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>支付方式</h3>
                <ul>
                    <li><a href="#">货到付款</a></li>
                    <li><a href="#">在线支付</a></li>
                    <li><a href="#">分期付款</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>售后服务</h3>
                <ul>
                    <li><a href="#">售后政策</a></li>
                    <li><a href="#">价格保护</a></li>
                    <li><a href="#">退款说明</a></li>
                </ul>
            </div>
        </div>
        <div class="copyright">
            <p>© 2023 HIGO购物 版权所有 | 本页面为仿京东购物网站演示页面</p>
        </div>
    </footer> 

    <script src="js/products.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/search.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
